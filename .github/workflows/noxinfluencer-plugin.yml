name: NoxInfluencer Codex Plugin

on:
  pull_request:
    paths:
      - ".agents/plugins/marketplace.json"
      - "plugins/noxinfluencer/**"
      - ".github/workflows/noxinfluencer-plugin.yml"
  push:
    paths:
      - ".agents/plugins/marketplace.json"
      - "plugins/noxinfluencer/**"
      - ".github/workflows/noxinfluencer-plugin.yml"

concurrency:
  group: noxinfluencer-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Plugin and Marketplace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/noxinfluencer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/noxinfluencer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Plugin and repository Marketplace
        run: npm run verify
